[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trip-organizer"
version = "0.1.0"
description = "Import and organize saved Google Maps places for trip planning"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "playwright>=1.45,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
